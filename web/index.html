<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kita-Agent 终端</title>
    <base href="/">

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked-katex-extension/lib/index.umd.js"></script>

    <!-- Import modular CSS -->
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/components.css">
</head>
<body>

<div class="app-container">
    <div class="sidebar">
        <div class="sidebar-top">
            <button class="new-chat-btn" id="btnNewChat">
                <span>+ 新对话</span>
                <span style="color: var(--text-muted);">K</span>
            </button>

            <div class="history-list">
                <div class="history-list-title">最近的对话</div>
                <div id="sessionList">
                    <div class="empty-state" style="padding: 10px; text-align: center; color: var(--text-muted); font-size: 0.85rem;">加载中...</div>
                </div>
            </div>
        </div>

        <div class="sidebar-bottom">
            <button class="settings-btn" id="btnMaintenance" title="系统维护">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                </svg>
                系统与控制台
            </button>
        </div>
    </div>

    <div class="chat-container">
        <div class="chat-header">
            <div>Kita-Agent 终端</div>
            <div style="font-size: 0.8rem; font-weight: normal; color: var(--text-muted);">模型: Default (Qwen)</div>
        </div>

        <div class="chat-messages" id="chatBox">
            <div class="message msg-agent">你好！我是 Kita，是一个具备逻辑思考能力的智能 AI 助手。有什么我可以帮你的吗？</div>
        </div>
        <div class="loading" id="loadingTip">Kita 正在思考中...</div>

        <div class="chat-input-wrapper">
            <div class="chat-input">
                <div class="dropdown" id="plusDropdown">
                    <button class="upload-btn" id="btnMoreOptions" title="更多操作">
                        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 5V19M5 12H19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                    <div class="dropdown-content">
                        <button id="btnOpenUploadModal">📂 上传知识库</button>
                        <button id="btnOpenGitModal">🐈 Git 导入</button>
                        <button id="btnOpenPromptModal">🌟 修改提示词</button>
                    </div>
                </div>
                <input type="text" id="userInput" placeholder="输入你想问的问题...">
                <button class="send-btn" id="btnSend">发送</button>
            </div>
        </div>
    </div>
</div>

<!-- Modals -->
<div class="modal" id="uploadModal">
    <div class="modal-content" style="max-width: 500px;">
        <div class="modal-header">📂 上传知识库</div>
        <div class="form-group">
            <label>知识标签 *</label>
            <input type="text" id="knowledgeTag" placeholder="例如: python_docs" required>
        </div>
        <div class="form-group">
            <label>来源名称</label>
            <input type="text" id="sourceName" placeholder="例如: 官方文档">
        </div>
        <div class="form-group">
            <label>知识内容 *</label>
            <textarea id="knowledgeText" placeholder="输入知识库文本..." style="min-height: 150px;"></textarea>
        </div>
        <div class="modal-actions">
            <button class="btn-cancel">取消</button>
            <button class="btn-submit" id="btnConfirmUpload">上传</button>
        </div>
    </div>
</div>

<div class="modal" id="gitModal">
    <div class="modal-content" style="max-width: 500px;">
        <div class="modal-header">🐈 Git 导入知识库</div>
        <div class="form-group">
            <label>Git 仓库链接 *</label>
            <input type="text" id="gitRepoUrl" placeholder="例如: https://github.com/user/repo" required>
        </div>
        <div class="form-group">
            <label>分支名称</label>
            <input type="text" id="gitBranch" placeholder="默认: main" value="main">
        </div>
        <div class="form-group">
            <label>知识标签 (可选)</label>
            <input type="text" id="gitKnowledgeTag" placeholder="例如: repo_docs">
        </div>
        <div class="modal-actions">
            <button class="btn-cancel">取消</button>
            <button class="btn-submit" id="btnConfirmGit">导入</button>
        </div>
    </div>
</div>

<div class="modal" id="promptModal">
    <div class="modal-content" style="max-width: 600px;">
        <div class="modal-header">🌟 修改提示词</div>
        <p style="font-size:0.85rem; color:var(--text-muted); margin-bottom:15px;">
            定义 AI 的角色身份。系统会自动在底层补齐工具调用的规则。
        </p>
        <div class="form-group">
            <textarea id="systemPromptInput" style="min-height: 200px; font-family: monospace; font-size: 0.95rem;"></textarea>
        </div>
        <div class="modal-actions">
            <button class="btn-cancel">取消</button>
            <button class="btn-submit" id="btnConfirmPrompt">保存</button>
        </div>
    </div>
</div>

<div class="modal" id="maintenanceModal">
    <div class="modal-content">
        <div class="modal-header">系统维护</div>
        <div class="data-section">
            <h3>📊 知识库统计</h3>
            <div id="knowledgeStats">加载中...</div>
        </div>
        <div class="data-section">
            <h3>💬 Redis 会话</h3>
            <div id="redisData">加载中...</div>
        </div>
        <div class="modal-actions">
            <button class="btn-cancel">关闭</button>
            <button class="btn-submit" id="btnRefreshMaintenance">刷新</button>
        </div>
    </div>
</div>

<div class="modal" id="renameModal">
    <div class="modal-content" style="max-width: 450px;">
        <div class="modal-header">重命名对话</div>
        <div class="form-group">
            <label>对话名称</label>
            <input type="text" id="renameInput" placeholder="请输入新的对话名称">
        </div>
        <div class="modal-actions">
            <button class="btn-cancel">取消</button>
            <button class="btn-submit" id="btnConfirmRename">确定</button>
        </div>
    </div>
</div>

<div class="modal" id="deleteModal">
    <div class="modal-content" style="max-width: 400px;">
        <div class="modal-header">删除对话</div>
        <div style="margin-bottom: 25px; color: var(--text-main); line-height: 1.5;">
            确定要删除这段对话吗？此操作不可恢复。
        </div>
        <div class="modal-actions">
            <button class="btn-cancel">取消</button>
            <button class="btn-submit" id="btnConfirmDelete" style="background: #ff4d4f;">删除</button>
        </div>
    </div>
</div>

<!-- Load Main App Logic -->
<script type="module" src="/js/app.js"></script>
</body>
</html>
